    <script>
      // Gracefully catch and suppress benign Vite WebSocket / HMR connection notices in sandboxed preview environments
      (function() {
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        function isBenign(args) {
          var msg = Array.prototype.slice.call(args).join(' ');
          return (
            msg.indexOf('[vite] failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('WebSocket') !== -1 && msg.indexOf('vite') !== -1 ||
            msg.indexOf('Cannot set property fetch') !== -1
          );
        }
        console.error = function() {
          if (isBenign(arguments)) return;
          return origConsoleError.apply(console, arguments);
        };
        console.warn = function() {
          if (isBenign(arguments)) return;
          return origConsoleWarn.apply(console, arguments);
        };
      })();

      // Fix: "Cannot set property fetch of #<Window> which has only a getter"
      // In sandboxed iframes or certain browser environments, window.fetch is getter-only on Window/Window.prototype.
      // We ensure it has a setter so third-party scripts (e.g. Google Identity Services / GSI) or wrappers can assign to it safely without throwing.
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;

          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch || (originalFetch ? originalFetch : window.fetch);
              },
              set: function(newFetch) {
                activeFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              if (window.Window && window.Window.prototype) {
                var protoDesc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
                if (protoDesc && !protoDesc.set) {
                  Object.defineProperty(window.Window.prototype, 'fetch', {
                    get: function() {
                      return activeFetch || (protoDesc.get ? protoDesc.get.call(this) : originalFetch);
                    },
                    set: function(newFetch) {
                      activeFetch = newFetch;
                    },
                    configurable: true,
                    enumerable: true
                  });
                }
              }
            } catch (e2) {}
          }
        } catch (e) {}

        // Suppress benign uncaught exceptions regarding getter-only fetch or Vite websocket in iframe
        window.addEventListener('error', function(event) {
          var msg = String(event && (event.message || event));
          if (
            msg.indexOf('fetch of #<Window>') !== -1 ||
            msg.indexOf('only a getter') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason || event);
          var reasonStr = String(reason && (reason.message || reason));
          if (
            reasonStr.indexOf('fetch of #<Window>') !== -1 ||
            reasonStr.indexOf('only a getter') !== -1 ||
            reasonStr.indexOf('WebSocket') !== -1 ||
            reasonStr.indexOf('vite') !== -1
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
